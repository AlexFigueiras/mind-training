name: sinc
description: Sistema Integrado de Neuroengenharia Cognitiva — Treinador Cerebral de Elite
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Persistence
  shared_preferences: ^2.3.2

  # Charts (BOT graphs)
  fl_chart: ^0.69.0

  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
